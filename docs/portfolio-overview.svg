<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">QGIS and Geospatial Analysis Portfolio Overview</title>
  <desc id="desc">A visual summary showing three portfolio pieces: public facilities mapping, buffer analysis, and AI-generated GIS review.</desc>
  <rect width="1200" height="560" fill="#f8fafc"/>
  <rect x="24" y="24" width="1152" height="512" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <text x="600" y="86" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#0f172a">
    QGIS &amp; Geospatial Analysis Portfolio
  </text>
  <text x="600" y="118" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#475569">
    Self-directed GIS work focused on documentation, map design, analysis, and quality review
  </text>

  <g transform="translate(80,170)">
    <rect x="0" y="0" width="320" height="240" rx="18" fill="#ecfeff" stroke="#0f766e" stroke-width="2"/>
    <rect x="0" y="0" width="320" height="12" rx="18" fill="#0f766e"/>
    <text x="28" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#0f172a">
      Public facilities map
    </text>
    <text x="28" y="96" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#334155">
      OpenStreetMap context
    </text>
    <text x="28" y="128" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#334155">
      Public facility locations
    </text>
    <text x="28" y="160" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#334155">
      Styled layout export
    </text>
  </g>

  <g transform="translate(440,170)">
    <rect x="0" y="0" width="320" height="240" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <rect x="0" y="0" width="320" height="12" rx="18" fill="#2563eb"/>
    <text x="28" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#0f172a">
      Buffer analysis
    </text>
    <text x="28" y="96" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#334155">
      1, 3, and 5 mile rings
    </text>
    <text x="28" y="128" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#334155">
      Intersection and summary
    </text>
    <text x="28" y="160" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#334155">
      Limitations documented
    </text>
  </g>

  <g transform="translate(800,170)">
    <rect x="0" y="0" width="320" height="240" rx="18" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
    <rect x="0" y="0" width="320" height="12" rx="18" fill="#d97706"/>
    <text x="28" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#0f172a">
      Quality review
    </text>
    <text x="28" y="96" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#334155">
      CRS and unit checks
    </text>
    <text x="28" y="128" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#334155">
      Source clarity review
    </text>
    <text x="28" y="160" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#334155">
      Rewritten workflow
    </text>
  </g>

  <g stroke="#94a3b8" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M400 290 H432"/>
    <path d="M760 290 H792"/>
    <path d="M432 290 l-14 -8 l0 16 z" fill="#94a3b8" stroke="none"/>
    <path d="M792 290 l-14 -8 l0 16 z" fill="#94a3b8" stroke="none"/>
  </g>

  <rect x="250" y="438" width="700" height="52" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="600" y="471" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#334155">
    Public data sources - QGIS workflow - Map export - QA review
  </text>
</svg>
